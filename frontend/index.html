<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pharmacy Inventory Dashboard</title>
</head>
<body>
  <h1>Pharmacy Inventory Dashboard</h1>
  <p id="status">Loading...</p>
  <ul id="branch-list"></ul>

  <script>
    fetch("/branches")
      .then(r => r.json())
      .then(data => {
        document.getElementById("status").textContent =
          "Loaded " + data.length + " branches";

        const list = document.getElementById("branch-list");
        data.forEach(b => {
          const li = document.createElement("li");
          li.textContent = b.name;
          list.appendChild(li);
        });
      })
      .catch(err => {
        document.getElementById("status").textContent = "Failed to load branches";
        console.error(err);
      });
  </script>
</body>
</html>
